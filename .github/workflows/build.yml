name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o ARGlassesSender.zip
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: ARGlassesSender
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ARGlassesSender/app/build/outputs/apk/debug/app-debug.apk
